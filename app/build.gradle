plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.hrt.budzik'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.hrt.budzik'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1-test'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Media3 handles AAC/ICY/HTTP redirects more robustly than platform MediaPlayer.
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
}
